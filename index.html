    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #060913;
        overflow: hidden;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 42%, #10172b 0%, #060913 72%);
        color: #e6d5b2;
        font-family: 'Cinzel', Georgia, serif;
        transition: opacity 0.42s ease;
      }

      #boot-loader.boot-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .boot-spinner {
        width: 58px;
        height: 58px;
        animation: bootSpin 8s linear infinite;
        filter: drop-shadow(0 0 12px rgba(212, 175, 101, 0.35));
      }

      .boot-label {
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(235, 213, 168, 0.86);
      }

      @keyframes bootSpin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite">
      <svg class="boot-spinner" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <circle cx="32" cy="32" r="27" stroke="#c9a252" stroke-width="1.5" stroke-opacity="0.45" />
        <circle
          cx="32"
          cy="32"
          r="20"
          stroke="#f0cf88"
          stroke-width="1.4"
          stroke-dasharray="5 4"
        />
        <path
          d="M32 9 L34.6 27.4 L53 32 L34.6 36.6 L32 55 L29.4 36.6 L11 32 L29.4 27.4 Z"
          fill="#e7c377"
        />
        <circle cx="32" cy="32" r="3.2" fill="#060913" stroke="#f6dd9f" stroke-width="1.4" />
      </svg>
      <span class="boot-label">Preparing the Observatory&hellip;</span>
    </div>

    <div id="app">
      <div id="canvas-container" aria-label="The Astrolabe Chamber 3D Observatory"></div>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
